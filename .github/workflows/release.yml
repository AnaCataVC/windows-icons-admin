name: Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish WinUI 3 Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Core Tests
        run: dotnet test tests/WindowsIconsAdmin.Core.Tests/WindowsIconsAdmin.Core.Tests.csproj -c Release

      - name: Publish WinUI 3 App (win-x64)
        run: |
          dotnet publish src/WindowsIconsAdmin.App/WindowsIconsAdmin.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -o dist/win-x64

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on runner."
            exit 1
          }
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          & $isccPath /DMyAppVersion=$tagVersion installer/setup.iss

      - name: Verify Deliverable
        shell: pwsh
        run: |
          $setupExe = "releases\WindowsIconsAdmin_Setup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Error "Installer deliverable not found at $setupExe"
            exit 1
          }
          Write-Host "Found installer deliverable: $setupExe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/WindowsIconsAdmin_Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
